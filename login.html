<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập – Võ Thuận Hair Salon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="shared/shared.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <h1>VÕ THUẬN</h1>
        <p>Hair Salon Management System</p>
      </div>
      <div class="login-body">
        <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px;">
          Chọn vai trò để trải nghiệm demo
        </p>

        <div class="login-roles">
          <!-- Customer -->
          <button class="login-role-btn" onclick="loginAs('customer')">
            <i style="background: var(--green-bg); color: var(--green);"><span class="fas fa-user"></span></i>
            <div>
              <div class="role-name">Khách Hàng</div>
              <div class="role-desc">Xem dịch vụ, đặt lịch online, thanh toán trước</div>
            </div>
          </button>

          <!-- Stylist -->
          <button class="login-role-btn" onclick="loginAs('stylist')">
            <i style="background: var(--blue-bg); color: var(--blue);"><span class="fas fa-scissors"></span></i>
            <div>
              <div class="role-name">Thợ / Stylist</div>
              <div class="role-desc">Xem lịch, thông tin khách, lương thưởng, portfolio</div>
            </div>
          </button>

          <!-- Admin -->
          <button class="login-role-btn" onclick="loginAs('admin')">
            <i style="background: var(--gold-dim); color: var(--gold);"><span class="fas fa-crown"></span></i>
            <div>
              <div class="role-name">Chủ Salon</div>
              <div class="role-desc">Quản lý CRM, chấm công, lương, doanh thu, thuế</div>
            </div>
          </button>
        </div>

        <a href="index.html" class="login-back">
          <i class="fas fa-arrow-left"></i> Về trang chủ
        </a>
      </div>
    </div>
  </div>

  <script src="data/mock-data.js"></script>
  <script src="shared/shared.js"></script>
  <script>
    function loginAs(role) {
      Auth.login(role);
      switch(role) {
        case 'customer': window.location.href = 'customer/booking.html'; break;
        case 'stylist': window.location.href = 'staff/dashboard.html'; break;
        case 'admin': window.location.href = 'admin/dashboard.html'; break;
      }
    }
  </script>
</body>
</html>
